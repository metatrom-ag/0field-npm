# Purpose: each release of 0field that reaches this repository is on npm as
# the package 0field, and on GitHub as a release.
#
# Intention: runs on a tag `v*` that metatrom-ag/0field's Dist workflow pushes
# to metatrom-ag/0field-npm with the dist it built — the package `npm pack`
# makes, named 0field at the tag's version — and publishes this checkout through
# npm's trusted publishing, configured on npmjs.com for this file. It runs
# on a runner GitHub hosts, as trusted publishing supports no self-hosted
# one (https://docs.npmjs.com/trusted-publishers); npm adds provenance, as
# this repository is public. Before that, it makes the tag a GitHub release
# carrying the package's tarball, so a release stands even where npm refuses.
# It calls no reusable workflow, as a public repository calls only public
# ones.
name: Publish

on:
  push:
    tags: ['v*']
  # Started by hand, it publishes what main holds, the newest dist, and makes no release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Name this repository
        # npm checks provenance against package.json's repository: this names the repository publishing, whatever the dist names.
        run: npm pkg set repository.type=git "repository.url=git+https://github.com/$GITHUB_REPOSITORY.git"
      - name: Release on GitHub
        if: github.ref_type == 'tag'
        run: |
          # A rerun after npm refused finds the release already standing, and goes on to npm.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          tarball=$(npm pack --silent | tail -n 1)
          gh release create "$GITHUB_REF_NAME" "$tarball" --title "0field $GITHUB_REF_NAME" --notes "npm i -g 0field@${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: |
          # Trusted publishing takes npm 11.5.1 or newer.
          npm install --global npm@^11.5.1
          # Verbose, so the log says how npm's trusted publishing exchanged the run's identity, or why it did not.
          npm publish --access public --loglevel verbose
